    </pattern>
    <mask id="dots"><rect width="1200" height="380" fill="url(#dotGrid)"/></mask>
    <clipPath id="canopy">
      <path d="M540 252 C560 150 640 118 720 140 C780 156 800 172 830 170 C870 166 900 112 990 104 C1070 98 1120 170 1128 252 Z"/>
