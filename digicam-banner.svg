      <stop offset="0.36" stop-color="#3b2f6e"/>
      <stop offset="0.62" stop-color="#a84e7c"/>
      <stop offset="0.84" stop-color="#ee8850"/>
      <stop offset="1" stop-color="#ffd08c"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
