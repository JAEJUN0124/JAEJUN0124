<svg width="100%" height="100" xmlns="http://www.w3.org/2000/svg">
  <style>
    .car {
      /* 'drive' 애니메이션을 5초간 무한 반복 */
      animation: drive 5s infinite linear;
      font-size: 40px; /* 자동차 크기 */
    }

    @keyframes drive {
      from { transform: translateX(-10%); } /* 왼쪽 밖에서 시작 */
      to { transform: translateX(110%); } /* 오른쪽 밖으로 사라짐 */
    }

    /* (선택) 다크/라이트 모드에 따라 트랙 색 변경 */
    .track {
       stroke: #DDDDDD; 
    }
    @media (prefers-color-scheme: dark) {
      .track {
         stroke: #555555; 
      }
    }
  </style>

  <g class="car">
    <text x="0" y="50">🏎️</text>
  </g>

  <line class="track" x1="0" y1="70" x2="100%" y2="70" stroke-width="2" stroke-dasharray="10 5"/>
</svg>
