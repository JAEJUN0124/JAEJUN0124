name: Stamp banner date

# 프로필을 고쳐서 main에 올릴 때마다 배너와 README 맨 아래의 날짜 각인을 그날 날짜(한국 시간)로 바꾼다.
# GITHUB_TOKEN으로 올린 커밋은 워크플로를 다시 깨우지 않으므로 반복되지 않는다.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: stamp-date
  cancel-in-progress: false

jobs:
  stamp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update date stamp
        run: |
          stamp="'$(TZ=Asia/Seoul date +'%y %m %d')"
          sed -i -E "s/'[0-9]{2} [0-9]{2} [0-9]{2}/${stamp}/g" digicam-banner.svg README.md
          if git diff --quiet; then
            echo "Date stamp is already ${stamp}"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "날짜 각인을 ${stamp}로 갱신"
          git push
